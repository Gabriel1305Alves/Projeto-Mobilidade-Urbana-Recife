server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/linhaviva
spring.datasource.username=linhaviva
spring.datasource.password=${DB_PASSWORD:linhaviva}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.jwt-secret=${JWT_SECRET:embarcai-dev-only}
app.jwt-expiracao-horas=72
